name: Publicar QuantPower Builder

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener la landing
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Sincronizar el respaldo de la última demo publicada
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          python deployment/actualizar_version_publicada.py "$RUNNER_TEMP/latest-release.json" content/site.json
          if ! git diff --quiet -- content/site.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/site.json
            VERSION=$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['tag_name'])" "$RUNNER_TEMP/latest-release.json")
            git commit -m "docs: sync public demo release $VERSION"
            git push origin main
          fi
      - name: Subir el sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
